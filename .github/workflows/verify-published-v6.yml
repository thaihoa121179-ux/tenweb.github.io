name: Verify published V6 photos and deployed assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-published-v6.yml'
      - 'bao-tang-da-nang-v6/**'
permissions:
  contents: read
concurrency:
  group: verify-published-v6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the image decoder with normal TLS/integrity checks
        run: python3 -m pip install 'Pillow==12.0.0'
      - name: Verify latest deployed assets and all real decoded photos
        run: >-
          python3 bao-tang-da-nang-v6/scripts/verify_published_v6.py
          --minimum-records 200 --minimum-dimension 128
          --asset-version 6.8 --max-wait 180 --workers 8
      - name: Retain the actual publication evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-v6-verification-${{ github.sha }}
          path: bao-tang-da-nang-v6/data/published-verification.json
          if-no-files-found: warn
          retention-days: 14
