name: Verify published V6 photos and deployed assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-published-v6.yml'
      - 'bao-tang-da-nang-v6/**'
permissions:
  contents: read
concurrency:
  group: verify-published-v6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the image decoder with normal TLS/integrity checks
        run: python3 -m pip install 'Pillow==12.0.0' 'beautifulsoup4==4.14.2'
      - name: Check corpus, quiz, RAG and Worker contracts
        run: node --test bao-tang-da-nang-v6/tests/*.test.mjs bao-tang-da-nang-v6/backend/*.test.mjs
      - name: Check data import and publication verifier fixtures
        run: python3 -m unittest discover -s bao-tang-da-nang-v6/tests -p 'test_*.py'
      - name: Verify latest deployed assets and all real decoded photos
        run: >-
          python3 bao-tang-da-nang-v6/scripts/verify_published_v6.py
          --minimum-records 200 --minimum-dimension 128
          --asset-version 7.6.0 --max-wait 180 --workers 8
      - name: Measure the published mobile page
        run: |
          npm install --prefix "$RUNNER_TEMP/museum-lighthouse" lighthouse@13.0.1 --no-audit --no-fund
          CHROME_PATH="$(command -v google-chrome)" "$RUNNER_TEMP/museum-lighthouse/node_modules/.bin/lighthouse" \
            'https://thaihoa121179-ux.github.io/tenweb.github.io/bao-tang-da-nang-v6/' \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
            --only-categories=performance,accessibility,best-practices \
            --output=json --output-path="$RUNNER_TEMP/museum-lighthouse.json" --quiet > "$RUNNER_TEMP/museum-lighthouse.log" 2>&1
          node -e 'const r=require(process.argv[1]); console.log(JSON.stringify(Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,Math.round(v.score*100)])))); if(r.categories.performance.score<0.85)process.exit(1)' "$RUNNER_TEMP/museum-lighthouse.json"
      - name: Summarize the actual public performance measurement
        if: always()
        run: node bao-tang-da-nang-v6/scripts/summarize_lighthouse.mjs "$RUNNER_TEMP/museum-lighthouse.json" "$RUNNER_TEMP/museum-lighthouse.log"
      - name: Retain the actual publication evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-v6-verification-${{ github.sha }}
          path: |
            bao-tang-da-nang-v6/data/published-verification.json
            ${{ runner.temp }}/museum-lighthouse.json
            ${{ runner.temp }}/museum-lighthouse.log
          if-no-files-found: warn
          retention-days: 14
