name: Inspect official public reference collection APIs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-reference-api.yml', 'bao-tang-da-nang-v6/scripts/probe_reference_api.py']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 bao-tang-da-nang-v6/scripts/probe_reference_api.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bao-tang-da-nang-v6/data/reference-api-sample.json
          if ! git diff --cached --quiet; then
            git commit -m 'Capture bounded official public object API schemas'
            git push origin HEAD:main
          fi
