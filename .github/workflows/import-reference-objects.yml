name: Import institution-scoped physical reference objects
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-reference-objects.yml', 'bao-tang-da-nang-v6/scripts/import_reference_objects.py']
permissions:
  contents: write
  pages: write
concurrency:
  group: museum-collection-data
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'beautifulsoup4==4.14.3' 'Pillow==12.0.0'
      - name: Import real unique illustrated reference objects
        run: |
          set -o pipefail
          python3 bao-tang-da-nang-v6/scripts/import_reference_objects.py --target 200 2>&1 | tee bao-tang-da-nang-v6/data/reference-import.log
      - name: Save validated source records, photos and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bao-tang-da-nang-v6/collection.js bao-tang-da-nang-v6/index.html bao-tang-da-nang-v6/data/reference-import.log
          if test -f bao-tang-da-nang-v6/data/reference-import-audit.json; then git add bao-tang-da-nang-v6/data/reference-import-audit.json; fi
          if test -d bao-tang-da-nang-v6/assets/reference; then git add bao-tang-da-nang-v6/assets/reference; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Import verified illustrated institution-scoped reference objects'
            git push origin HEAD:main
          fi
      - name: Rebuild website after valid import
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST 'repos/${{ github.repository }}/pages/builds'
