name: Discover official museum collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/discover-museum-collection.yml', 'bao-tang-da-nang-v6/scripts/discover_collection.py']
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 bao-tang-da-nang-v6/scripts/discover_collection.py
      - name: Save official source snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bao-tang-da-nang-v6/data/source-discovery.json
          if ! git diff --cached --quiet; then
            git commit -m 'Capture official museum catalogue for collection import'
            git push origin HEAD:main
          fi
