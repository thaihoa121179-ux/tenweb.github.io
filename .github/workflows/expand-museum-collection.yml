name: Expand complete official museum collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/expand-museum-collection.yml', 'bao-tang-da-nang-v6/scripts/expand_collection.py']
permissions:
  contents: write
  pages: write
concurrency:
  group: expand-museum-collection
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'beautifulsoup4==4.14.3' 'Pillow==12.0.0'
      - name: Select complete official records and validate their photos
        run: python3 bao-tang-da-nang-v6/scripts/expand_collection.py
      - name: Publish validated catalogue data and local photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bao-tang-da-nang-v6/collection.js bao-tang-da-nang-v6/assets/collection bao-tang-da-nang-v6/data/collection-audit.json bao-tang-da-nang-v6/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Expand museum catalogue with complete official records and local photos'
            git push origin HEAD:main
          fi
      - name: Rebuild website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST 'repos/${{ github.repository }}/pages/builds'
